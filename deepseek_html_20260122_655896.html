<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Game - Word Scramble</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        
        .header {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .game-container {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        h1 {
            color: #333;
            margin-bottom: 5px;
            font-size: 2em;
        }
        
        .student-info {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        
        .student-id {
            font-size: 1.2em;
            color: #667eea;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .game-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 25px 0;
        }
        
        .stat-box {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 2em;
            font-weight: bold;
            display: block;
        }
        
        .stat-label {
            font-size: 0.9em;
            opacity: 0.9;
        }
        
        .scrambled-word-container {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            padding: 40px;
            border-radius: 15px;
            margin: 30px 0;
            text-align: center;
        }
        
        .scrambled-word {
            font-size: 3em;
            letter-spacing: 15px;
            color: white;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            margin: 20px 0;
        }
        
        .word-number {
            color: white;
            font-size: 1.2em;
            opacity: 0.9;
        }
        
        .game-input-container {
            margin: 30px 0;
        }
        
        .game-input {
            width: 100%;
            padding: 20px;
            font-size: 1.3em;
            border: 3px solid #ddd;
            border-radius: 12px;
            text-align: center;
            transition: all 0.3s ease;
        }
        
        .game-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }
        
        .game-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 25px 0;
        }
        
        button {
            padding: 18px;
            font-size: 1.2em;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .submit-btn {
            background: linear-gradient(135deg, #00b09b 0%, #96c93d 100%);
            color: white;
        }
        
        .hint-btn {
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            color: #333;
        }
        
        .skip-btn {
            background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%);
            color: #333;
        }
        
        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 7px 20px rgba(0,0,0,0.2);
        }
        
        button:active {
            transform: translateY(-1px);
        }
        
        .feedback {
            margin: 20px 0;
            padding: 20px;
            border-radius: 10px;
            font-size: 1.2em;
            font-weight: bold;
            text-align: center;
            min-height: 30px;
        }
        
        .correct {
            background: #d4edda;
            color: #155724;
            border-left: 5px solid #28a745;
        }
        
        .incorrect {
            background: #f8d7da;
            color: #721c24;
            border-left: 5px solid #dc3545;
        }
        
        .hint-text {
            background: #fff3cd;
            color: #856404;
            border-left: 5px solid #ffc107;
        }
        
        .progress-container {
            margin: 30px 0;
        }
        
        .progress-bar {
            width: 100%;
            height: 15px;
            background: #e9ecef;
            border-radius: 10px;
            overflow: hidden;
            margin: 10px 0;
        }
        
        .progress {
            height: 100%;
            background: linear-gradient(90deg, #00b09b, #96c93d);
            width: 0%;
            transition: width 0.5s ease;
        }
        
        .words-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 10px;
            margin: 30px 0;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }
        
        .word-item {
            padding: 10px;
            background: white;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            border: 2px solid #dee2e6;
            transition: all 0.3s ease;
        }
        
        .word-item.completed {
            background: #d4edda;
            border-color: #28a745;
            color: #155724;
        }
        
        .word-item.current {
            background: #cce5ff;
            border-color: #007bff;
            color: #004085;
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0,123,255,0.3);
        }
        
        .game-over {
            display: none;
            text-align: center;
            padding: 40px;
        }
        
        .trophy {
            font-size: 4em;
            margin: 20px 0;
        }
        
        .final-score {
            font-size: 3em;
            color: #764ba2;
            margin: 20px 0;
        }
        
        .time-spent {
            color: #666;
            margin: 10px 0;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }
            
            .game-container {
                padding: 20px;
            }
            
            .scrambled-word {
                font-size: 2em;
                letter-spacing: 10px;
            }
            
            .game-buttons {
                grid-template-columns: 1fr;
            }
            
            button {
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1>Word Scramble Game</h1>
                <p>Unscramble the vocabulary words!</p>
            </div>
            <div class="student-info">
                <div class="student-id">
                    <span>Student ID: </span>
                    <span id="student-id-display">Loading...</span>
                </div>
                <div id="student-name-display"></div>
            </div>
        </div>
        
        <div class="game-container">
            <div class="game-stats">
                <div class="stat-box">
                    <span class="stat-value" id="score">0</span>
                    <span class="stat-label">SCORE</span>
                </div>
                <div class="stat-box">
                    <span class="stat-value" id="words-completed">0</span>
                    <span class="stat-label">COMPLETED</span>
                </div>
                <div class="stat-box">
                    <span class="stat-value" id="words-left">58</span>
                    <span class="stat-label">WORDS LEFT</span>
                </div>
                <div class="stat-box">
                    <span class="stat-value" id="hints-left">5</span>
                    <span class="stat-label">HINTS LEFT</span>
                </div>
            </div>
            
            <div class="scrambled-word-container">
                <div class="word-number" id="word-number">Word 1 of 58</div>
                <div class="scrambled-word" id="scrambled-word">LOADING...</div>
                <div id="hint-display"></div>
            </div>
            
            <div class="progress-container">
                <div>Progress: <span id="progress-percent">0%</span></div>
                <div class="progress-bar">
                    <div class="progress" id="progress-bar"></div>
                </div>
            </div>
            
            <div class="game-input-container">
                <input type="text" class="game-input" id="user-input" 
                       placeholder="Type the unscrambled word here..." autofocus>
            </div>
            
            <div class="feedback" id="feedback"></div>
            
            <div class="game-buttons">
                <button class="submit-btn" onclick="checkAnswer()">
                    <span>✓</span> Submit Answer
                </button>
                <button class="hint-btn" onclick="giveHint()">
                    <span>💡</span> Get Hint (5 left)
                </button>
                <button class="skip-btn" onclick="skipWord()">
                    <span>⏭️</span> Skip Word
                </button>
            </div>
            
            <div class="words-list" id="words-list">
                <!-- Words will be inserted here -->
            </div>
            
            <div id="game-over" class="game-over">
                <div class="trophy">🏆</div>
                <h2>Game Complete!</h2>
                <div class="final-score">Final Score: <span id="final-score">0</span></div>
                <div class="time-spent">Time Spent: <span id="time-spent">0:00</span></div>
                <p>Your results have been saved. Well done!</p>
                <button class="submit-btn" onclick="restartGame()" style="margin-top: 20px;">
                    Play Again
                </button>
            </div>
        </div>
    </div>

    <script>
        // Vocabulary words
        const vocabularyWords = [
            'apple', 'bread', 'chair', 'dance', 'earth', 'fish', 'game', 'happy', 'idea',
            'jumping', 'kitchen', 'lemon', 'monkey', 'nurse', 'orange', 'window', 'x-ray',
            'yogurt', 'zipper', 'paper', 'quiet', 'rainbow', 'school', 'tiger', 'umbrella',
            'visit', 'water', 'xylophone', 'yellow', 'basket', 'doctor', 'flower', 'garden',
            'internet', 'balloon', 'chocolate', 'elephant', 'fantastic', 'jacket', 'letter',
            'mountain', 'notebook', 'ocean', 'pencil', 'quietly', 'robot', 'sunset',
            'teacher', 'universe', 'volcano', 'belt', 'dull', 'easy', 'hate', 'know', 'live', 'love'
        ];

        // Game variables
        let currentWord = '';
        let scrambledWord = '';
        let score = 0;
        let currentIndex = 0;
        let hintsLeft = 5;
        let startTime;
        let studentId;
        let studentName = '';
        let answers = [];

        // Firebase configuration - REPLACE WITH YOUR FIREBASE CONFIG
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
            projectId: "YOUR_PROJECT",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Initialize Firebase
        let database;
        try {
            firebase.initializeApp(firebaseConfig);
            database = firebase.database();
        } catch (error) {
            console.log("Firebase not configured. Using local storage instead.");
        }

        // DOM Elements
        const scrambledWordEl = document.getElementById('scrambled-word');
        const userInputEl = document.getElementById('user-input');
        const scoreEl = document.getElementById('score');
        const wordsLeftEl = document.getElementById('words-left');
        const wordsCompletedEl = document.getElementById('words-completed');
        const hintsLeftEl = document.getElementById('hints-left');
        const feedbackEl = document.getElementById('feedback');
        const progressBarEl = document.getElementById('progress-bar');
        const progressPercentEl = document.getElementById('progress-percent');
        const wordNumberEl = document.getElementById('word-number');
        const gameOverEl = document.getElementById('game-over');
        const finalScoreEl = document.getElementById('final-score');
        const timeSpentEl = document.getElementById('time-spent');
        const wordsListEl = document.getElementById('words-list');
        const studentIdDisplay = document.getElementById('student-id-display');
        const studentNameDisplay = document.getElementById('student-name-display');

        // Initialize student
        function initStudent() {
            // Check if student ID exists in URL
            const urlParams = new URLSearchParams(window.location.search);
            studentId = urlParams.get('id');
            
            if (!studentId) {
                // Generate new student ID
                studentId = 'S' + Math.floor(1000 + Math.random() * 9000);
                window.history.replaceState({}, '', `?id=${studentId}`);
            }
            
            studentIdDisplay.textContent = studentId;
            
            // Ask for student name if not set
            const savedName = localStorage.getItem(`student_name_${studentId}`);
            if (!savedName) {
                studentName = prompt("Enter your name:", `Student ${studentId}`);
                if (studentName) {
                    localStorage.setItem(`student_name_${studentId}`, studentName);
                } else {
                    studentName = `Student ${studentId}`;
                }
            } else {
                studentName = savedName;
            }
            
            studentNameDisplay.textContent = studentName;
            
            // Load saved progress
            loadProgress();
            
            // Start game
            startTime = new Date();
            newRound();
        }

        // Scramble word function
        function scrambleWord(word) {
            let letters = word.split('');
            // Special handling for hyphenated words
            if (word.includes('-')) {
                const parts = word.split('-');
                return parts.map(part => scrambleWord(part)).join('-');
            }
            
            // Fisher-Yates shuffle
            for (let i = letters.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [letters[i], letters[j]] = [letters[j], letters[i]];
            }
            
            const scrambled = letters.join('');
            return scrambled === word ? scrambleWord(word) : scrambled;
        }

        // Start new round
        function newRound() {
            if (currentIndex >= vocabularyWords.length) {
                endGame();
                return;
            }

            currentWord = vocabularyWords[currentIndex];
            scrambledWord = scrambleWord(currentWord);
            
            scrambledWordEl.textContent = scrambledWord.toUpperCase();
            userInputEl.value = '';
            feedbackEl.textContent = '';
            feedbackEl.className = 'feedback';
            
            wordNumberEl.textContent = `Word ${currentIndex + 1} of ${vocabularyWords.length}`;
            wordsLeftEl.textContent = vocabularyWords.length - currentIndex;
            wordsCompletedEl.textContent = currentIndex;
            
            // Update progress
            const progress = ((currentIndex + 1) / vocabularyWords.length) * 100;
            progressBarEl.style.width = `${progress}%`;
            progressPercentEl.textContent = `${Math.round(progress)}%`;
            
            // Update words list
            updateWordsList();
            
            // Focus input
            userInputEl.focus();
            
            // Save progress
            saveProgress();
        }

        // Check answer
        function checkAnswer() {
            const userAnswer = userInputEl.value.trim().toLowerCase();
            
            if (!userAnswer) {
                showFeedback('Please enter an answer!', 'incorrect');
                return;
            }

            const isCorrect = userAnswer === currentWord;
            const points = isCorrect ? 10 : -2;
            score = Math.max(0, score + points);
            
            // Record answer
            answers.push({
                word: currentWord,
                scrambled: scrambledWord,
                answer: userAnswer,
                correct: isCorrect,
                timestamp: new Date().toISOString()
            });

            // Update display
            scoreEl.textContent = score;
            
            if (isCorrect) {
                showFeedback('✅ Correct! Well done!', 'correct');
                // Move to next word after delay
                setTimeout(() => {
                    currentIndex++;
                    newRound();
                }, 1000);
            } else {
                showFeedback('❌ Incorrect! Try again. Hint: Starts with "' + currentWord.charAt(0) + '"', 'incorrect');
            }
            
            saveProgress();
        }

        // Give hint
        function giveHint() {
            if (hintsLeft <= 0) {
                showFeedback('No hints left!', 'incorrect');
                return;
            }

            hintsLeft--;
            hintsLeftEl.textContent = hintsLeft;
            document.querySelector('.hint-btn span').textContent = `💡 (${hintsLeft} left)`;
            
            const hintLength = Math.ceil(currentWord.length / 2);
            const hint = currentWord.substring(0, hintLength) + '_'.repeat(currentWord.length - hintLength);
            showFeedback(`💡 Hint: ${hint}`, 'hint-text');
            
            // Penalty for hint
            score = Math.max(0, score - 1);
            scoreEl.textContent = score;
            
            saveProgress();
        }

        // Skip word
        function skipWord() {
            showFeedback(`Skipped! The word was: ${currentWord}`, 'incorrect');
            
            // Record skip
            answers.push({
                word: currentWord,
                scrambled: scrambledWord,
                answer: 'skipped',
                correct: false,
                skipped: true,
                timestamp: new Date().toISOString()
            });
            
            // Penalty
            score = Math.max(0, score - 5);
            scoreEl.textContent = score;
            
            // Move to next word
            setTimeout(() => {
                currentIndex++;
                newRound();
            }, 1500);
            
            saveProgress();
        }

        // Show feedback
        function showFeedback(message, type) {
            feedbackEl.textContent = message;
            feedbackEl.className = `feedback ${type}`;
        }

        // Update words list
        function updateWordsList() {
            wordsListEl.innerHTML = '';
            vocabularyWords.forEach((word, index) => {
                const wordEl = document.createElement('div');
                wordEl.className = 'word-item';
                wordEl.textContent = word;
                
                if (index < currentIndex) {
                    wordEl.classList.add('completed');
                } else if (index === currentIndex) {
                    wordEl.classList.add('current');
                }
                
                wordsListEl.appendChild(wordEl);
            });
        }

        // Save progress to Firebase/localStorage
        function saveProgress() {
            const progressData = {
                studentId: studentId,
                studentName: studentName,
                score: score,
                currentIndex: currentIndex,
                hintsLeft: hintsLeft,
                answers: answers,
                lastUpdated: new Date().toISOString(),
                timeSpent: Math.floor((new Date() - startTime) / 1000)
            };

            // Save to localStorage
            localStorage.setItem(`progress_${studentId}`, JSON.stringify(progressData));

            // Save to Firebase if available
            if (database) {
                database.ref('students/' + studentId).set(progressData)
                    .catch(error => console.log("Firebase save error:", error));
            }
        }

        // Load progress
        function loadProgress() {
            const saved = localStorage.getItem(`progress_${studentId}`);
            if (saved) {
                const progressData = JSON.parse(saved);
                score = progressData.score || 0;
                currentIndex = progressData.currentIndex || 0;
                hintsLeft = progressData.hintsLeft || 5;
                answers = progressData.answers || [];
                
                scoreEl.textContent = score;
                hintsLeftEl.textContent = hintsLeft;
                document.querySelector('.hint-btn span').textContent = `💡 (${hintsLeft} left)`;
                
                if (progressData.startTime) {
                    startTime = new Date(progressData.startTime);
                }
            }
        }

        // End game
        function endGame() {
            const endTime = new Date();
            const timeSpent = Math.floor((endTime - startTime) / 1000);
            const minutes = Math.floor(timeSpent / 60);
            const seconds = timeSpent % 60;
            
            gameOverEl.style.display = 'block';
            document.querySelector('.game-container > *:not(.game-over)').style.display = 'none';
            
            finalScoreEl.textContent = score;
            timeSpentEl.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
            
            // Save final results
            saveProgress();
            
            // Send to Firebase
            if (database) {
                const finalData = {
                    studentId: studentId,
                    studentName: studentName,
                    finalScore: score,
                    totalWords: vocabularyWords.length,
                    correctAnswers: answers.filter(a => a.correct).length,
                    timeSpent: timeSpent,
                    completedAt: new Date().toISOString(),
                    answers: answers
                };
                
                database.ref('completedStudents/' + studentId).set(finalData);
            }
        }

        // Restart game
        function restartGame() {
            score = 0;
            currentIndex = 0;
            hintsLeft = 5;
            answers = [];
            startTime = new Date();
            
            document.querySelector('.game-container > *:not(.game-over)').style.display = '';
            gameOverEl.style.display = 'none';
            
            scoreEl.textContent = '0';
            hintsLeftEl.textContent = '5';
            document.querySelector('.hint-btn span').textContent = '💡 (5 left)';
            
            newRound();
        }

        // Initialize when page loads
        window.onload = initStudent;

        // Keyboard support
        userInputEl.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                checkAnswer();
            }
        });
    </script>
</body>
</html>
