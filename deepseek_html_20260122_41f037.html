<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Dashboard - Word Scramble</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        
        .subtitle {
            color: #666;
            font-size: 1.1em;
        }
        
        .dashboard-container {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }
        
        .stats-overview {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
        }
        
        .stat-card.green {
            background: linear-gradient(135deg, #00b09b 0%, #96c93d 100%);
        }
        
        .stat-card.blue {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }
        
        .stat-card.orange {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
        }
        
        .stat-value {
            font-size: 2.5em;
            font-weight: bold;
            display: block;
            margin: 10px 0;
        }
        
        .stat-label {
            font-size: 1em;
            opacity: 0.9;
        }
        
        .students-table {
            overflow-x: auto;
            margin: 30px 0;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }
        
        th {
            background: #f8f9fa;
            padding: 15px;
            text-align: left;
            font-weight: bold;
            color: #333;
            border-bottom: 3px solid #dee2e6;
        }
        
        td {
            padding: 15px;
            border-bottom: 1px solid #dee2e6;
        }
        
        tr:hover {
            background: #f8f9fa;
        }
        
        .status {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: bold;
        }
        
        .status.completed {
            background: #d4edda;
            color: #155724;
        }
        
        .status.in-progress {
            background: #fff3cd;
            color: #856404;
        }
        
        .status.not-started {
            background: #f8d7da;
            color: #721c24;
        }
        
        .progress-cell {
            min-width: 200px;
        }
        
        .progress-bar-small {
            width: 100%;
            height: 10px;
            background: #e9ecef;
            border-radius: 5px;
            overflow: hidden;
            margin: 5px 0;
        }
        
        .progress-small {
            height: 100%;
            background: linear-gradient(90deg, #00b09b, #96c93d);
        }
        
        .controls {
            display: flex;
            gap: 15px;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
        }
        
        .btn-success {
            background: #00b09b;
            color: white;
        }
        
        .btn-warning {
            background: #ff9a9e;
            color: white;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .word-details {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 2px solid #dee2e6;
        }
        
        .word-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
            margin: 20px 0;
        }
        
        .word-item {
            padding: 10px;
            background: #f8f9fa;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
        }
        
        .word-item.correct {
            background: #d4edda;
            border: 2px solid #28a745;
        }
        
        .word-item.incorrect {
            background: #f8d7da;
            border: 2px solid #dc3545;
        }
        
        .word-item.pending {
            background: #fff3cd;
            border: 2px solid #ffc107;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 800px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }
        
        .close-modal {
            float: right;
            font-size: 1.5em;
            cursor: pointer;
            color: #666;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }
            
            .dashboard-container {
                padding: 20px;
            }
            
            .stats-overview {
                grid-template-columns: 1fr;
            }
            
            table {
                font-size: 0.9em;
            }
            
            th, td {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>👨‍🏫 Teacher Dashboard</h1>
            <p class="subtitle">Monitor all 18 students in real-time</p>
        </div>
        
        <div class="dashboard-container">
            <div class="controls">
                <button class="btn btn-primary" onclick="refreshData()">
                    <span>🔄</span> Refresh Data
                </button>
                <button class="btn btn-success" onclick="exportData()">
                    <span>📊</span> Export to Excel
                </button>
                <button class="btn btn-warning" onclick="resetGame()">
                    <span>🔄</span> Reset All Games
                </button>
                <div style="margin-left: auto; display: flex; align-items: center; gap: 10px;">
                    <span>🔗 Student Link:</span>
                    <input type="text" id="student-link" value="student.html" readonly 
                           style="padding: 8px; border: 1px solid #ddd; border-radius: 5px; min-width: 200px;">
                    <button class="btn" onclick="copyStudentLink()" style="background: #6c757d; color: white;">
                        Copy
                    </button>
                </div>
            </div>
            
            <div class="stats-overview">
                <div class="stat-card">
                    <span class="stat-label">TOTAL STUDENTS</span>
                    <span class="stat-value" id="total-students">0</span>
                </div>
                <div class="stat-card green">
                    <span class="stat-label">COMPLETED</span>
                    <span class="stat-value" id="completed-students">0</span>
                </div>
                <div class="stat-card blue">
                    <span class="stat-label">AVERAGE SCORE</span>
                    <span class="stat-value" id="average-score">0</span>
                </div>
                <div class="stat-card orange">
                    <span class="stat-label">ACTIVE NOW</span>
                    <span class="stat-value" id="active-students">0</span>
                </div>
            </div>
            
            <div class="students-table">
                <h2>Student Progress</h2>
                <table id="students-table">
                    <thead>
                        <tr>
                            <th>Student ID</th>
                            <th>Name</th>
                            <th>Status</th>
                            <th>Progress</th>
                            <th>Score</th>
                            <th>Correct</th>
                            <th>Time Spent</th>
                            <th>Last Updated</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="students-table-body">
                        <!-- Student rows will be inserted here -->
                    </tbody>
                </table>
            </div>
            
            <div class="word-details" id="word-details" style="display: none;">
                <h3 id="selected-student-name"></h3>
                <div class="word-grid" id="word-details-grid">
                    <!-- Word details will be inserted here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Modal for detailed view -->
    <div class="modal" id="student-detail-modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <h2 id="modal-student-name"></h2>
            <div id="modal-content">
                <!-- Detailed content will be inserted here -->
            </div>
        </div>
    </div>

    <script>
        // Firebase configuration - USE SAME AS STUDENT GAME
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
            projectId: "YOUR_PROJECT",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Initialize Firebase
        let database;
        let studentsRef;
        
        try {
            firebase.initializeApp(firebaseConfig);
            database = firebase.database();
            studentsRef = database.ref('students');
        } catch (error) {
            console.log("Firebase not configured. Teacher dashboard needs Firebase.");
            document.getElementById('students-table-body').innerHTML = 
                '<tr><td colspan="9" style="text-align: center; color: red; padding: 40px;">' +
                '⚠️ Firebase not configured. Please add your Firebase configuration.</td></tr>';
        }

        // Sample vocabulary words for reference
        const vocabularyWords = [
            'apple', 'bread', 'chair', 'dance', 'earth', 'fish', 'game', 'happy', 'idea',
            'jumping', 'kitchen', 'lemon', 'monkey', 'nurse', 'orange', 'window', 'x-ray',
            'yogurt', 'zipper', 'paper', 'quiet', 'rainbow', 'school', 'tiger', 'umbrella',
            'visit', 'water', 'xylophone', 'yellow', 'basket', 'doctor', 'flower', 'garden',
            'internet', 'balloon', 'chocolate', 'elephant', 'fantastic', 'jacket', 'letter',
            'mountain', 'notebook', 'ocean', 'pencil', 'quietly', 'robot', 'sunset',
            'teacher', 'universe', 'volcano', 'belt', 'dull', 'easy', 'hate', 'know', 'live', 'love'
        ];

        // Listen for student data changes
        function startListening() {
            if (!studentsRef) return;
            
            studentsRef.on('value', (snapshot) => {
                const studentsData = snapshot.val();
                updateDashboard(studentsData);
            });
            
            // Also listen for completed students
            database.ref('completedStudents').on('value', (snapshot) => {
                const completedData = snapshot.val();
                // Update stats
            });
        }

        // Update dashboard with student data
        function updateDashboard(studentsData) {
            const tableBody = document.getElementById('students-table-body');
            const totalStudentsEl = document.getElementById('total-students');
            const completedStudentsEl = document.getElementById('completed-students');
            const averageScoreEl = document.getElementById('average-score');
            const activeStudentsEl = document.getElementById('active-students');
            
            if (!studentsData) {
                tableBody.innerHTML = '<tr><td colspan="9" style="text-align: center; padding: 40px;">No students active yet.</td></tr>';
                return;
            }
            
            let totalStudents = 0;
            let completedCount = 0;
            let totalScore = 0;
            let activeCount = 0;
            let tableHTML = '';
            
            const now = new Date();
            
            Object.entries(studentsData).forEach(([studentId, studentData]) => {
                totalStudents++;
                
                const lastUpdated = new Date(studentData.lastUpdated);
                const minutesAgo = Math.floor((now - lastUpdated) / (1000 * 60));
                const isActive = minutesAgo < 5; // Active if updated in last 5 minutes
                
                if (isActive) activeCount++;
                
                const progress = studentData.currentIndex || 0;
                const totalWords = vocabularyWords.length;
                const progressPercent = Math.round((progress / totalWords) * 100);
                const isCompleted = progress >= totalWords;
                
                if (isCompleted) completedCount++;
                totalScore += studentData.score || 0;
                
                // Determine status
                let status = 'not-started';
                let statusText = 'Not Started';
                if (progress > 0 && progress < totalWords) {
                    status = 'in-progress';
                    statusText = 'In Progress';
                } else if (isCompleted) {
                    status = 'completed';
                    statusText = 'Completed';
                }
                
                tableHTML += `
                    <tr>
                        <td>${studentId}</td>
                        <td>${studentData.studentName || 'Unnamed'}</td>
                        <td><span class="status ${status}">${statusText}</span></td>
                        <td class="progress-cell">
                            ${progressPercent}% (${progress}/${totalWords})
                            <div class="progress-bar-small">
                                <div class="progress-small" style="width: ${progressPercent}%"></div>
                            </div>
                        </td>
                        <td><strong>${studentData.score || 0}</strong></td>
                        <td>${studentData.answers ? studentData.answers.filter(a => a.correct).length : 0}</td>
                        <td>${formatTime(studentData.timeSpent || 0)}</td>
                        <td>${formatDate(studentData.lastUpdated)}</td>
                        <td>
                            <button class="btn" onclick="viewStudentDetails('${studentId}')" 
                                    style="padding: 5px 10px; font-size: 0.9em;">
                                👁️ View
                            </button>
                        </td>
                    </tr>
                `;
            });
            
            tableBody.innerHTML = tableHTML;
            totalStudentsEl.textContent = totalStudents;
            completedStudentsEl.textContent = completedCount;
            averageScoreEl.textContent = totalStudents > 0 ? Math.round(totalScore / totalStudents) : 0;
            activeStudentsEl.textContent = activeCount;
        }

        // View student details
        function viewStudentDetails(studentId) {
            studentsRef.child(studentId).once('value', (snapshot) => {
                const studentData = snapshot.val();
                if (!studentData) return;
                
                const modal = document.getElementById('student-detail-modal');
                const modalName = document.getElementById('modal-student-name');
                const modalContent = document.getElementById('modal-content');
                
                modalName.textContent = `${studentData.studentName} (${studentId})`;
                
                let detailsHTML = `
                    <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin: 20px 0;">
                        <div>
                            <h3>📊 Statistics</h3>
                            <p><strong>Score:</strong> ${studentData.score || 0}</p>
                            <p><strong>Progress:</strong> ${studentData.currentIndex || 0}/${vocabularyWords.length}</p>
                            <p><strong>Hints Left:</strong> ${studentData.hintsLeft || 0}</p>
                            <p><strong>Time Spent:</strong> ${formatTime(studentData.timeSpent || 0)}</p>
                        </div>
                        <div>
                            <h3>📝 Answers</h3>
                            <p><strong>Total Answers:</strong> ${studentData.answers ? studentData.answers.length : 0}</p>
                            <p><strong>Correct:</strong> ${studentData.answers ? studentData.answers.filter(a => a.correct).length : 0}</p>
                            <p><strong>Accuracy:</strong> ${studentData.answers && studentData.answers.length > 0 ? 
                                Math.round((studentData.answers.filter(a => a.correct).length / studentData.answers.length) * 100) : 0}%</p>
                        </div>
                    </div>
                `;
                
                if (studentData.answers && studentData.answers.length > 0) {
                    detailsHTML += `
                        <h3>📋 Answer History</h3>
                        <div style="max-height: 300px; overflow-y: auto; margin: 20px 0;">
                            <table style="width: 100%;">
                                <thead>
                                    <tr>
                                        <th>Word</th>
                                        <th>Scrambled</th>
                                        <th>Answer</th>
                                        <th>Result</th>
                                        <th>Time</th>
                                    </tr>
                                </thead>
                                <tbody>
                    `;
                    
                    studentData.answers.forEach(answer => {
                        detailsHTML += `
                            <tr>
                                <td>${answer.word}</td>
                                <td>${answer.scrambled}</td>
                                <td>${answer.answer}</td>
                                <td>${answer.correct ? '✅' : '❌'}</td>
                                <td>${formatTimeShort(new Date(answer.timestamp))}</td>
                            </tr>
                        `;
                    });
                    
                    detailsHTML += `
                                </tbody>
                            </table>
                        </div>
                    `;
                }
                
                modalContent.innerHTML = detailsHTML;
                modal.style.display = 'flex';
            });
        }

        // Close modal
        function closeModal() {
            document.getElementById('student-detail-modal').style.display = 'none';
        }

        // Refresh data
        function refreshData() {
            studentsRef.once('value', (snapshot) => {
                updateDashboard(snapshot.val());
            });
        }

        // Export data to Excel
        function exportData() {
            studentsRef.once('value', (snapshot) => {
                const studentsData = snapshot.val();
                let csv = 'Student ID,Name,Score,Progress,Correct Answers,Time Spent,Status,Last Updated\n';
                
                if (studentsData) {
                    Object.entries(studentsData).forEach(([studentId, studentData]) => {
                        const progress = studentData.currentIndex || 0;
                        const totalWords = vocabularyWords.length;
                        const correctAnswers = studentData.answers ? studentData.answers.filter(a => a.correct).length : 0;
                        const status = progress >= totalWords ? 'Completed' : progress > 0 ? 'In Progress' : 'Not Started';
                        
                        csv += `"${studentId}","${studentData.studentName || ''}",${studentData.score || 0},${progress}/${totalWords},${correctAnswers},${formatTime(studentData.timeSpent || 0)},"${status}","${studentData.lastUpdated}"\n`;
                    });
                }
                
                // Download CSV
                const blob = new Blob([csv], { type: 'text/csv' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `word-scramble-results-${new Date().toISOString().slice(0,10)}.csv`;
                a.click();
            });
        }

        // Reset all games
        function resetGame() {
            if (confirm('Are you sure you want to reset all student progress? This cannot be undone.')) {
                if (database) {
                    database.ref('students').remove();
                    database.ref('completedStudents').remove();
                    alert('All student progress has been reset.');
                }
            }
        }

        // Copy student link
        function copyStudentLink() {
            const linkInput = document.getElementById('student-link');
            const baseUrl = window.location.href.replace('teacher.html', 'student.html');
            linkInput.value = baseUrl;
            linkInput.select();
            document.execCommand('copy');
            alert('Student link copied to clipboard!');
        }

        // Format time
        function formatTime(seconds) {
            const minutes = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${minutes}:${secs.toString().padStart(2, '0')}`;
        }

        // Format date
        function formatDate(dateString) {
            if (!dateString) return 'Never';
            const date = new Date(dateString);
            return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        // Format short time
        function formatTimeShort(date) {
            return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        // Initialize dashboard
        window.onload = function() {
            if (database) {
                startListening();
                // Set student link
                const baseUrl = window.location.href.replace('teacher.html', 'student.html');
                document.getElementById('student-link').value = baseUrl;
            }
        };
    </script>
</body>
</html>
